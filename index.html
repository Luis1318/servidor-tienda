<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda de Ropa Interactiva</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; color: #333; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .producto { background: #fafafa; padding: 12px; margin-bottom: 10px; border-left: 4px solid #007bff; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Mi Tienda de Ropa</h1>

    <!-- FORMULARIO DE REGISTRO -->
    <div class="card">
        <h3>Registrar Nuevo Producto</h3>
        <label for="nombre">Nombre de la prenda:</label>
        <input type="text" id="nombre" placeholder="Ej. Playera Deportiva">

        <label for="precio">Precio ($):</label>
        <input type="number" id="precio" placeholder="Ej. 299">

        <label for="talla">Talla:</label>
        <input type="text" id="talla" placeholder="Ej. Chica, Mediana, G">

        <button onclick="registrarProducto()">Guardar en la Base de Datos</button>
    </div>

    <!-- SECCIÓN DEL CATÁLOGO -->
    <div class="card">
        <h3>Catálogo de Productos</h3>
        <div id="lista-productos">Cargando productos...</div>
    </div>

    <script>
        // FUNCIÓN 1: Cargar y listar los productos desde el servidor (GET)
        function cargarProductos() {
            fetch('http://localhost:3000/api/productos')
                .then(response => response.json())
                .then(data => {
                    const contenedor = document.getElementById('lista-productos');
                    if (data.length === 0) {
                        contenedor.innerHTML = '<p>No hay productos registrados aún.</p>';
                        return;
                    }
                    contenedor.innerHTML = '';
                    data.forEach(prod => {
                        contenedor.innerHTML += `
                            <div class="producto">
                                <strong>${prod.nombre}</strong><br>
                                Precio: $${prod.precio} | Talla: ${prod.talla}
                            </div>
                        `;
                    });
                })
                .catch(error => {
                    console.error('Error al conectar:', error);
                    document.getElementById('lista-productos').innerHTML = '<p style="color:red;">Error al cargar el catálogo. Verifica que el servidor esté encendido.</p>';
                });
        }

        // FUNCIÓN 2: Enviar los datos del formulario al servidor (POST)
        function registrarProducto() {
            const nombre = document.getElementById('nombre').value;
            const precio = document.getElementById('precio').value;
            const talla = document.getElementById('talla').value;

            // Validar que no estén vacíos
            if (!nombre || !precio || !talla) {
                alert('Por favor completa todos los campos.');
                return;
            }

            // Petición HTTP usando POST
            fetch('http://localhost:3000/api/productos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre: nombre, precio: parseFloat(precio), talla: talla })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message); // Muestra el mensaje de éxito del servidor
                // Limpiar campos del formulario
                document.getElementById('nombre').value = '';
                document.getElementById('precio').value = '';
                document.getElementById('talla').value = '';
                
                cargarProductos(); // Recarga automáticamente la lista para ver el nuevo producto
            })
            .catch(error => {
                console.error('Error al registrar:', error);
                alert('Hubo un error al registrar el producto.');
            });
        }

        // Ejecutar la función de carga al abrir la página por primera vez
        cargarProductos();
    </script>
</body>
</html>
